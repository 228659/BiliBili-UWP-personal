name: Build UWP (x64)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere not found" }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild not found" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $msbuild -version

      - name: Restore
        shell: pwsh
        run: |
          & $env:MSBUILD BiliBili-UWP.sln /t:Restore /p:Configuration=Debug /p:Platform=x64 /nologo /v:m

      - name: Build Debug x64
        shell: pwsh
        run: |
          & $env:MSBUILD BiliBili-UWP.sln /p:Configuration=Debug /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /nologo /v:m

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili-UWP-x64-debug
          path: |
            BiliBili-UWP/BiliBili-UWP/bin/x64/Debug/**
            BiliBili-UWP/BiliBili-UWP/AppPackages/**
          if-no-files-found: warn
