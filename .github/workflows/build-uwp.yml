name: Build UWP (x64)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere not found" }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild not found" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $msbuild -version

      - name: Restore
        shell: pwsh
        run: |
          & $env:MSBUILD BiliBili-UWP.sln /t:Restore /p:Configuration=Debug /p:Platform=x64 /nologo /v:m

      - name: Build Debug x64
        shell: pwsh
        run: |
          & $env:MSBUILD BiliBili-UWP.sln /p:Configuration=Debug /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /nologo /v:m

      - name: List build output
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "BiliBili-UWP/bin/x64/Debug" -Force -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-ChildItem . -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-ChildItem . -Recurse -Filter AppxManifest.xml -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object FullName

      - name: Stage build output
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $pkg = "BiliBili-UWP/AppPackages"
          if (Test-Path $pkg) { Copy-Item $pkg artifact/AppPackages -Recurse }
          $layout = "BiliBili-UWP/bin/x64/Debug/AppX"
          if (Test-Path $layout) { Copy-Item $layout artifact/AppX -Recurse }
          Get-ChildItem artifact -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili-UWP-x64-debug
          path: artifact
          if-no-files-found: warn
