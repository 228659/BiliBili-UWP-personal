name: Build UWP (x64)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere not found" }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild not found" }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $msbuild -version

      - name: Restore
        shell: pwsh
        run: |
          & $env:MSBUILD BiliBili-UWP.sln /t:Restore /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /nologo /v:m

      - name: Build ${{ matrix.configuration }} x64
        shell: pwsh
        run: |
          & $env:MSBUILD BiliBili-UWP.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /nologo /v:m

      - name: List build output
        if: always()
        shell: pwsh
        run: |
          $out = "BiliBili-UWP/bin/x64/${{ matrix.configuration }}"
          Get-ChildItem $out -Force -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-ChildItem . -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Stage build output
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $pkg = "BiliBili-UWP/AppPackages"
          if (Test-Path $pkg) { Copy-Item $pkg artifact/AppPackages -Recurse }
          # 直接注册 bin 布局会在激活阶段崩溃，改用 MSIX 解包后的目录
          $msix = Get-ChildItem $pkg -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msix) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $dest = Join-Path $PWD "artifact/AppX"
            New-Item -ItemType Directory -Force $dest | Out-Null
            [System.IO.Compression.ZipFile]::ExtractToDirectory($msix.FullName, $dest)
            "extracted $($msix.Name) -> artifact/AppX"
          } else {
            Write-Warning "no msix found under $pkg"
          }
          "artifact files: " + (Get-ChildItem artifact -Recurse -File -ErrorAction SilentlyContinue).Count

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili-UWP-x64-${{ matrix.configuration }}
          path: artifact
          if-no-files-found: warn
